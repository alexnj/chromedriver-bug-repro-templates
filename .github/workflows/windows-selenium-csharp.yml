name: Windows Selenium C#.NET

on:
  push:
    paths:
      - 'selenium-csharp/**'
      - '.github/workflows/windows-selenium-csharp.yml'
  pull_request:
    paths:
      - 'selenium-csharp/**'
      - '.github/workflows/windows-selenium-csharp.yml'

defaults:
  run:
    working-directory: selenium-csharp


jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Locate Chrome and Configure Enterprise Policy
      run: |
        # Locate chrome.exe
        $chromePath = (Get-ChildItem -Path "C:\Program Files\Google\Chrome\Application\chrome.exe", "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" -ErrorAction SilentlyContinue).FullName
        Write-Host "Found Chrome at: $chromePath"
        echo "CHROME_PATH=$chromePath" >> $env:GITHUB_ENV

        # Apply policy to HKLM (System) and HKCU (User) to be certain
        $registryPaths = @("HKLM:\SOFTWARE\Policies\Google\Chrome", "HKCU:\SOFTWARE\Policies\Google\Chrome")
        foreach ($path in $registryPaths) {
            if (!(Test-Path $path)) { New-Item -Path $path -Force }
            Set-ItemProperty -Path $path -Name "ShowHomeButton" -Value 1 -Type DWord
            # Also set a cloud management token (dummy) which often triggers the managed UI
            Set-ItemProperty -Path $path -Name "CloudManagementEnrollmentToken" -Value "repro-dummy-token" -Type String
        }

        # Verify registry
        reg query "HKLM\SOFTWARE\Policies\Google\Chrome"
        reg query "HKCU\SOFTWARE\Policies\Google\Chrome"

    - name: Run tests
      run: dotnet test --no-restore --logger:"console;verbosity=detailed"

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: selenium-csharp/**/*.png

    - name: Dump log
      if: always()
      run: cat d:\\chromedriver.log
