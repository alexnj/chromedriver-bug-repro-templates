name: Windows Selenium C#.NET

on:
  push:
    paths:
      - 'selenium-csharp/**'
      - '.github/workflows/windows-selenium-csharp.yml'
  pull_request:
    paths:
      - 'selenium-csharp/**'
      - '.github/workflows/windows-selenium-csharp.yml'

defaults:
  run:
    working-directory: selenium-csharp


jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Install Google Chrome (System)
      run: |
        if (!(Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe") -and !(Test-Path "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe")) {
          choco install googlechrome --no-progress -y
        }

    - name: Locate Chrome and Configure Enterprise Policy
      run: |
        $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        if (!(Test-Path $chromePath)) {
            $chromePath = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
        }
        
        if (!(Test-Path $chromePath)) {
            Write-Error "CRITICAL: Google Chrome (System) not found!"
            exit 1
        }

        Write-Host "Forcing System Chrome at: $chromePath"
        echo "CHROME_PATH=$chromePath" >> $env:GITHUB_ENV
        echo "SE_BROWSER_PATH=$chromePath" >> $env:GITHUB_ENV

        # Apply policies using reg.exe for maximum compatibility with both hives and architectures
        # 0x1 = Enabled, 0x0 = Disabled
        $keys = @(
            "HKLM\SOFTWARE\Policies\Google\Chrome",
            "HKCU\SOFTWARE\Policies\Google\Chrome"
        )
        
        foreach ($key in $keys) {
            # Show Home Button
            reg add "$key" /v ShowHomeButton /t REG_DWORD /d 1 /f /reg:64
            reg add "$key" /v ShowHomeButton /t REG_DWORD /d 1 /f /reg:32
            # Disable Password Manager (obvious policy)
            reg add "$key" /v PasswordManagerEnabled /t REG_DWORD /d 0 /f /reg:64
            reg add "$key" /v PasswordManagerEnabled /t REG_DWORD /d 0 /f /reg:32
            # Add Dummy Enrollment Token
            reg add "$key" /v CloudManagementEnrollmentToken /t REG_SZ /d "repro-dummy-token" /f /reg:64
            reg add "$key" /v CloudManagementEnrollmentToken /t REG_SZ /d "repro-dummy-token" /f /reg:32
        }

    - name: Run tests
      run: |
        Write-Host "Verifying Registry Policies..."
        reg query "HKLM\SOFTWARE\Policies\Google\Chrome" /s /reg:64
        reg query "HKCU\SOFTWARE\Policies\Google\Chrome" /s /reg:64
        dotnet test --no-restore --logger:"console;verbosity=detailed"

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: selenium-csharp/**/*.png

    - name: Dump log
      if: always()
      run: cat d:\\chromedriver.log
