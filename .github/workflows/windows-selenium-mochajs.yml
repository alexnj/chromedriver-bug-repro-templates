name: Windows Selenium Mocha.js

on:
  push:
    paths:
      - 'selenium-mochajs/**'
      - '.github/workflows/windows-selenium-mochajs.yml'
  pull_request:
    paths:
      - 'selenium-mochajs/**'
      - '.github/workflows/windows-selenium-mochajs.yml'

defaults:
  run:
    working-directory: selenium-mochajs

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: Install dependencies
      run: npm install

    - name: Install Google Chrome (System)
      run: |
        if (!(Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe") -and !(Test-Path "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe")) {
          choco install googlechrome --no-progress -y
        }

    - name: Locate Chrome and Configure Enterprise Policy
      run: |
        $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        if (!(Test-Path $chromePath)) {
            $chromePath = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
        }
        
        if (!(Test-Path $chromePath)) {
            Write-Error "CRITICAL: Google Chrome (System) not found!"
            exit 1
        }

        Write-Host "Forcing System Chrome at: $chromePath"
        Add-Content -Path $env:GITHUB_ENV -Value "CHROME_PATH=$chromePath"
        Add-Content -Path $env:GITHUB_ENV -Value "SE_BROWSER_PATH=$chromePath"
        Add-Content -Path $env:GITHUB_ENV -Value "SE_OFFLINE_MODE=true"

    - name: Verify Environment
      run: |
        Write-Host "CHROME_PATH: $env:CHROME_PATH"
        Write-Host "SE_BROWSER_PATH: $env:SE_BROWSER_PATH"
        Write-Host "SE_OFFLINE_MODE: $env:SE_OFFLINE_MODE"

    - name: Run tests
      run: npm test

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: selenium-mochajs/*.png

    - name: Dump log
      if: always()
      run: Get-Content chromedriver.log -ErrorAction Ignore
