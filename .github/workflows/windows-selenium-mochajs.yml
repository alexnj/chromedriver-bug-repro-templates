name: Windows Selenium MochaJS

on:
  push:
    paths:
      - 'selenium-mochajs/**'
      - '.github/workflows/windows-selenium-mochajs.yml'
  pull_request:
    paths:
      - 'selenium-mochajs/**'
      - '.github/workflows/windows-selenium-mochajs.yml'

defaults:
  run:
    working-directory: selenium-mochajs

jobs:
  test:
    runs-on: windows-latest 
    strategy: 
      fail-fast: false 

    steps:
    - uses: actions/checkout@v4 

    - name: Set up Node.js
      uses: actions/setup-node@v4 
      with:
        node-version: '20' 

    - name: Install dependencies
      working-directory: selenium-mochajs
      run: npm install

    - name: Run Mocha tests 
      working-directory: selenium-mochajs
      run: npm test

    - name: Upload bug reproduction artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: capture-txt
        path: selenium-mochajs/capture.txt

    - name: Dump log
      if: always()
      run: cat chromedriver.log
